name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Audit public source and bundled privacy
        run: |
          python3 scripts/audit-publication.py
          python3 scripts/generate-privacy.py --check
      - name: Scan Git history with verified Gitleaks
        run: |
          mkdir -p .probe/security
          curl -fsSL -o .probe/security/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb .probe/security/gitleaks.tar.gz | sha256sum -c -
          tar -xzf .probe/security/gitleaks.tar.gz -C .probe/security
          .probe/security/gitleaks git . --redact --no-banner
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Audit publication and wrapper
        run: python3 scripts/audit-publication.py
      - name: Install Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .probe/codex/codex-rs/target
            .probe/openssl-android
          key: native-linux-${{ runner.arch }}-rust1.98-ndk27-${{ hashFiles('scripts/build-native.sh') }}
      - name: Build pinned native dependencies
        run: bash scripts/build-native.sh
      - name: Save successful native build before packaging
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .probe/codex/codex-rs/target
            .probe/openssl-android
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Install verified notice generator
        run: |
          curl -fsSL -o .probe/cargo-about.tar.gz https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL -o .probe/cargo-about.sha256 https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz.sha256
          expected=$(awk '{print $1}' .probe/cargo-about.sha256)
          printf '%s  %s\n' "$expected" .probe/cargo-about.tar.gz | sha256sum -c -
          mkdir -p .probe/cargo-about
          tar -xzf .probe/cargo-about.tar.gz -C .probe/cargo-about
          tool=$(find .probe/cargo-about -type f -name cargo-about | head -1)
          python3 scripts/generate-notices.py --cargo-about "$tool"
      - name: Build APK, test APK, and unsigned release bundle
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease :app:lintDebug --no-daemon --console=plain 2>&1 | tee .probe/gradle-build.log
      - name: Report packaging failure in public annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path('.probe/gradle-build.log')
          if log.is_file():
              text = log.read_text(errors='replace')
              start = text.find('FAILURE:')
              detail = text[start:] if start >= 0 else '\n'.join(text.splitlines()[-40:])
              detail = detail[:8000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Android packaging failed::' + detail)
          PY
      - name: Audit final source snapshot
        run: python3 scripts/audit-publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-beta-builds
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/reports/lint-results-debug.html
